<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tally</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        background: #f2efe7;
        -webkit-font-smoothing: antialiased;
        font-family: Archivo, system-ui, sans-serif;
        color: #211f1c;
      }
      input { font: inherit; color: inherit; background: transparent; }
      input:focus { outline: none; }
      button { font-family: inherit; }
      a { color: #2c2823; }
      a:hover { color: #000; }
      input[type=range] { accent-color: #2c2823; }
      @keyframes scanline { 0% { top: 8%; } 100% { top: 92%; } }
      @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes blip { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes tapeIn { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
