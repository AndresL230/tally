<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tally</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f2efe7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tally" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        background: #f2efe7;
        -webkit-font-smoothing: antialiased;
        font-family: Archivo, system-ui, sans-serif;
        color: #211f1c;
      }
      input { font: inherit; color: inherit; background: transparent; }
      input:focus { outline: none; }
      button { font-family: inherit; }
      a { color: #2c2823; }
      a:hover { color: #000; }
      input[type=range] { accent-color: #2c2823; }
      .navlink:hover { background: rgba(0,0,0,.05); color: #4a453d; }
      /* Date inputs: strip the native chrome so their underline sits at the
         same height as the text inputs beside them (mobile Safari/Chrome
         otherwise add intrinsic padding that mis-aligns the row). */
      input[type=date] { appearance: none; -webkit-appearance: none; border-radius: 0; }
      input[type=date]::-webkit-date-and-time-value { text-align: left; margin: 0; }
      /* Paper-toned scrollbars (the native ones clash on desktop). The
         standard properties cover Firefox and Chrome 121+; the -webkit rules
         cover older Chromium/Safari, which ignore the standard ones. */
      * { scrollbar-width: thin; scrollbar-color: #c9c2b6 transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: #c9c2b6;
        border-radius: 8px;
        border: 3px solid #f2efe7;
      }
      ::-webkit-scrollbar-thumb:hover { background: #a8a298; }
      @keyframes scanline { 0% { top: 8%; } 100% { top: 92%; } }
      @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes blip { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes tapeIn { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
      /* The split card unfolding under a receipt row (confirm screen), and
         folding back up. Padding rides along so the card closes to nothing
         rather than to an empty band. */
      @keyframes splitOpen { from { opacity: 0; transform: translateY(-8px); max-height: 0; padding-top: 0; padding-bottom: 0; } to { opacity: 1; transform: none; max-height: 240px; padding-top: 18px; padding-bottom: 18px; } }
      @keyframes splitClose { from { opacity: 1; transform: none; max-height: 240px; padding-top: 18px; padding-bottom: 18px; } to { opacity: 0; transform: translateY(-8px); max-height: 0; padding-top: 0; padding-bottom: 0; } }
      /* Crossing a receipt line out (confirm screen) recolors the row, its
         spine, its amount and its leader all at once. Transitioning them
         together turns that from a snap into a fade; the strike itself stays
         crisp, since text-decoration cannot be tweened. The selector reaches
         the children because their colors are set inline, per element. */
      .receipt-row, .receipt-row * {
        transition: background-color .2s ease, color .2s ease, opacity .2s ease,
                    border-color .2s ease, -webkit-text-fill-color .2s ease;
      }
      /* The split card's slider: a two-tone track (the friend's colour up to
         the thumb, the viewer's beyond it — the row spine's language) under
         a thumb big enough for a thumb. --split-track is set inline. */
      .split-range { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 0; background: transparent; cursor: pointer; }
      .split-range:focus { outline: none; }
      .split-range::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: var(--split-track); }
      .split-range::-moz-range-track { height: 8px; border-radius: 4px; background: var(--split-track); }
      .split-range::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -9px; border-radius: 50%; background: #fff; border: 1px solid rgba(0,0,0,.12); box-shadow: 0 1px 4px rgba(0,0,0,.28); }
      .split-range::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 1px solid rgba(0,0,0,.12); box-shadow: 0 1px 4px rgba(0,0,0,.28); }
      .split-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(0,0,0,.12), 0 1px 4px rgba(0,0,0,.28); }
      .split-range:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px rgba(0,0,0,.12), 0 1px 4px rgba(0,0,0,.28); }
      @media (prefers-reduced-motion: reduce) {
        .receipt-row, .receipt-row * { transition: none; }
        .split-card { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
